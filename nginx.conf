server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Production Defense Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Video Range Requests & Media Caching
    location ~* \.(mp4|webm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static JS, CSS & Font Chunks
    location ~* \.(js|css|woff|woff2|png|jpg|jpeg|webp|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Telemetry Stubs & Compatibility Interceptors (PostHog & Cloudflare)
    location ~ ^/(stubs/|e/?|decide/?) {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "X-CSRF-Token, X-Requested-With, Accept, Content-Type";
        if ($request_method = OPTIONS) {
            return 200;
        }
        return 200 "";
    }

    # CSP Violation Report Ingestion Sink
    location = /api/csp-report {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        return 204;
    }

    # Main Entrypoint
    location / {
        try_files $uri $uri/ /index.html;
    }
}
