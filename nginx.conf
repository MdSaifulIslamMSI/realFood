# Hardened Nginx configuration for the air-gapped realfood.gov mirror.
#
# The security headers live in /etc/nginx/snippets/security-headers.conf and
# are generated from security/policy.mjs by scripts/mirror/update-production-csp.mjs.
#
# Nginx only inherits `add_header` from the enclosing level when the child level
# declares no `add_header` of its own. Every location that sets Cache-Control or
# Allow therefore re-includes the snippet explicitly. Dropping that include is
# what silently removed HSTS/CSP from asset responses in the previous revision.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # CSP reports are capped at 64 KB by the application; leave headroom for
    # framing but never allow arbitrary large uploads.
    client_max_body_size 128k;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Never expose dotfiles (except ACME challenges) or JavaScript source maps.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.map$ {
        return 404;
    }

    # Container health probe. Kept header-free of cache directives.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # CSP violation ingestion sink. POST only; browsers never send preflights.
    location = /api/csp-report {
        if ($request_method !~ ^(POST|OPTIONS)$) {
            return 405;
        }
        if ($request_method = OPTIONS) {
            add_header Allow "POST, OPTIONS" always;
            return 204;
        }

        add_header Allow "POST, OPTIONS" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 204;
    }

    # The Nginx target does not expose the Vercel serverless API surface. Fail
    # closed instead of serving the SPA shell for unknown API paths.
    location ^~ /api/ {
        return 404;
    }

    # PostHog/Cloudflare telemetry compatibility endpoints. Same-origin only:
    # emitting a wildcard or reflected ACAO here would let any website drive
    # the mirror and read the responses.
    location ~ ^/(e|decide)/?$ {
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 405;
        }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, HEAD, POST, OPTIONS" always;
            return 204;
        }

        add_header Allow "GET, HEAD, POST, OPTIONS" always;
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 200;
    }

    # Local compatibility stubs referenced by the sanitized bundles.
    location ^~ /stubs/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Video Range requests and downloadable documents.
    location ~* \.(?:mp4|webm|pdf|vtt)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed static bundles and fonts.
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|avif|gif|ico|svg)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA entrypoint.
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
